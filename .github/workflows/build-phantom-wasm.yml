name: Build Phantom WASM

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'packages/phantom-sdk/**'

jobs:
  build-wasm:
    name: Build Phantom WASM (wasm-pack)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg=wasm_js"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Build Phantom WASM (wasip1 target)
        working-directory: packages/phantom-sdk/wasm
        env:
          RUSTFLAGS: "--cfg=wasm_js"
        run: |
          rustup target add wasm32-wasip1 || true
          sudo apt-get update -y && sudo apt-get install -y clang wasi-sdk build-essential libc6-dev || true
          export CC=$(which clang) || true
          cargo build --release --target wasm32-wasip1
          mkdir -p pkg
          cp target/wasm32-wasip1/release/phantom_wasm.wasm pkg/ || true

      - name: Upload WASM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-sdk-wasm
          path: packages/phantom-sdk/wasm/pkg

      - name: Publish to workspace (optional)
        if: false
        run: |
          echo "Publishing artifacts to registry is disabled in this workflow by default."
