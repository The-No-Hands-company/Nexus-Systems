name: Build Phantom WASM

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'packages/phantom-sdk/**'

jobs:
  build-wasm:
    name: Build Phantom WASM (wasm-pack)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg=wasm_js"
      WASI_SDK_URL: "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0-linux.tar.gz"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal

      - name: Ensure nightly is default and wasm target installed
        run: |
          echo "Ensuring rustup nightly is default and wasm32-wasip1 target is installed"
          rustup toolchain install nightly --allow-downgrade || true
          rustup default nightly || true
          rustup target add wasm32-wasip1 --toolchain nightly || true
          rustup component add rust-src --toolchain nightly || true
          echo "Installed targets for nightly:"
          rustup target list --toolchain nightly --installed || true

      - name: Build Phantom WASM (wasi target)
        working-directory: packages/phantom-sdk/wasm
        env:
          RUSTFLAGS: "--cfg=wasm_js"
        run: |
          # If a prebuilt wasm artifact is present in the repo, use it and skip the build.
          if [ -f ./artifacts/phantom_wasm.wasm ]; then
            echo "Found prebuilt phantom_wasm.wasm in repo, using it"
            mkdir -p pkg
            cp ./artifacts/phantom_wasm.wasm pkg/phantom_wasm.wasm || true
            echo "Skipping build step"
            exit 0
          fi

          # Ensure nightly toolchain and target are installed
          rustup toolchain install nightly || true
          rustup target add wasm32-wasip1 --toolchain nightly || true
          rustup component add rust-src --toolchain nightly || true

          # Install wasi sdk and build tools
          sudo apt-get update -y
          sudo apt-get install -y clang wasi-sdk build-essential libc6-dev pkg-config || true
          echo "dpkg -l wasi-sdk (if present):" || true
          dpkg -l | grep wasi-sdk || true
          echo "Listing possible wasi sdk install locations:"
          ls -la /usr/lib | grep wasi || true
          ls -la /usr/share | grep wasi || true

          # Detect wasi-sdk path
          WASI_SDK_PATH=$(ls -d /usr/lib/wasi-sdk* /usr/share/wasi-sdk* /opt/wasi-sdk* 2>/dev/null | head -n1 || true)
          if [ -z "$WASI_SDK_PATH" ]; then
            WASI_SDK_PATH=/usr/lib/wasi-sdk
          fi
          echo "Using WASI_SDK_PATH=$WASI_SDK_PATH"

          # Expose WASI_SDK_DIR for native C build scripts (pqcrypto-internals)
          export WASI_SDK_DIR="$WASI_SDK_PATH"

          # Debug: show wasi sdk dir contents and tool versions
          echo "WASI_SDK_DIR=$WASI_SDK_DIR"
          if [ -d "$WASI_SDK_DIR" ]; then
            ls -la "$WASI_SDK_DIR" || true
          else
            echo "WASI_SDK_DIR is not a directory"
          fi
          echo "Which clang: $(which clang 2>/dev/null || true)"
          clang --version || true
          echo "Which wasm-ld: $(which wasm-ld 2>/dev/null || true)"

          # Set cross-linker and tools for the target
          export CC="$WASI_SDK_PATH/bin/clang"
          export AR="$WASI_SDK_PATH/bin/llvm-ar"
          export CARGO_TARGET_WASM32_WASIP1_LINKER="$CC"

          # Fallback: download and extract wasi-sdk tarball if WASI_SDK_DIR is not valid
          if [ ! -d "$WASI_SDK_DIR" ] || [ ! -x "$WASI_SDK_DIR/bin/clang" ]; then
            echo "WASI_SDK_DIR missing or clang not executable; attempting to download wasi-sdk tarball"
            # Use env WASI_SDK_URL if set, otherwise fallback to official release
            WASI_SDK_URL="${WASI_SDK_URL:-https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0-linux.tar.gz}"
            echo "Downloading wasi-sdk from $WASI_SDK_URL"
            curl -fsSL "$WASI_SDK_URL" -o /tmp/wasi-sdk.tar.gz || { echo "Failed to download wasi-sdk from $WASI_SDK_URL"; exit 1; }
            sudo mkdir -p /opt
            sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt --strip-components=1 || { echo "Failed to extract wasi-sdk"; exit 1; }

            # Download and extract wasi sysroot (required for C standard headers)
            WASI_SYSROOT_URL="${WASI_SYSROOT_URL:-https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sysroot-20.0.tar.gz}"
            echo "Downloading wasi-sysroot from $WASI_SYSROOT_URL"
            curl -fsSL "$WASI_SYSROOT_URL" -o /tmp/wasi-sysroot.tar.gz || { echo "Failed to download wasi-sysroot from $WASI_SYSROOT_URL"; exit 1; }
            sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt --strip-components=1 || { echo "Failed to extract wasi-sysroot"; exit 1; }

            # Point WASI_SDK_DIR to extracted SDK and add bin to PATH
            export WASI_SDK_DIR=/opt
            export PATH="$WASI_SDK_DIR/bin:$PATH"
            export CC="$WASI_SDK_DIR/bin/clang"
            export AR="$WASI_SDK_DIR/bin/llvm-ar"
            export CARGO_TARGET_WASM32_WASIP1_LINKER="$CC"
            echo "Downloaded and set WASI_SDK_DIR=$WASI_SDK_DIR"
          fi

          # Diagnostic: print cargo metadata and tree, clean target, and run verbose build
          echo "--- Rust and cargo versions ---"
          rustc --version || true
          cargo --version || true
          echo "--- Cargo metadata ---"
          cargo metadata --format-version 1 --no-deps || true
          echo "--- Cargo tree ---"
          cargo tree || true
          echo "--- Disk usage of target dir before clean ---"
          du -sh target || true
          echo "Cleaning target dir"
          rm -rf target || true
          echo "--- Disk usage after clean ---"
          du -sh . || true

          # Build with nightly and build-std (pulls in std for target) in verbose mode
          cargo +nightly build -Z build-std=std --release --target wasm32-wasip1 -v

          # Package the produced wasm
          mkdir -p pkg
          cp target/wasm32-wasip1/release/phantom_wasm.wasm pkg/ || true

      - name: Upload WASM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-sdk-wasm
          path: packages/phantom-sdk/wasm/pkg

      - name: Publish to workspace (optional)
        if: false
        run: |
          echo "Publishing artifacts to registry is disabled in this workflow by default."
