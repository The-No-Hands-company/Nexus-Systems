[package]
name = "nexus-mailsmtp"
description = "SMTP for Nexus Email: the session state machine and the listener"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexus-mailstore = { path = "../nexus-mailstore" }
nexus-mailmsg = { path = "../nexus-mailmsg" }
nexus-maildelivery = { path = "../nexus-maildelivery" }
nexus-mailauth = { path = "../nexus-mailauth" }
nexus-mailimap = { path = "../nexus-mailimap" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[[bin]]
name = "nexus-mailsmtpd"
path = "src/main.rs"
