<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nexus Music</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12151f;
      --panel: #0d1017;
      --line: #1e2436;
      --line-bright: #2d3748;
      --text: #f1f5f9;
      --muted: #8492a6;
      --accent: #ec4899;
      --accent-hover: #db2777;
      --player-bg: #0a0d14;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 54px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 16px;
      shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .brand-icon {
      width: 26px; height: 26px; border-radius: 6px;
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: ui-monospace, monospace; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--accent); background: rgba(236,72,153,0.1);
      border: 1px solid rgba(236,72,153,0.25); border-radius: 999px; padding: 2px 8px;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; background: var(--card);
      border: 1px solid var(--line); color: var(--text); padding: 6px 12px;
      border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;
      text-decoration: none; transition: all 0.15s ease;
    }
    .btn:hover { border-color: var(--line-bright); background: #181d2a; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-sm { padding: 4px 8px; font-size: 12px; }

    .layout {
      flex: 1;
      display: flex;
      min-height: 0;
      height: calc(100vh - 54px - 74px);
    }
    .sidebar {
      width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      shrink: 0;
      padding: 14px;
      gap: 14px;
    }
    .sidebar-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); display: flex; justify-content: space-between; align-items: center;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
      color: var(--muted); transition: all 0.15s;
    }
    .nav-item:hover { background: var(--card); color: var(--text); }
    .nav-item.active { background: rgba(236,72,153,0.15); border: 1px solid rgba(236,72,153,0.3); color: #fff; font-weight: 600; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
      overflow-y: auto;
      padding: 20px;
    }

    table.tracks-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    table.tracks-table th {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-bright);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }
    table.tracks-table td {
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      white-space: nowrap;
    }
    table.tracks-table tr:hover td { background: rgba(255,255,255,0.02); }
    .track-title-cell { display: flex; align-items: center; gap: 10px; font-weight: 500; }
    .play-btn {
      width: 28px; height: 28px; border-radius: 50%; background: var(--card);
      border: 1px solid var(--line); color: var(--text); display: flex; align-items: center;
      justify-content: center; font-size: 11px; cursor: pointer; transition: all 0.15s;
    }
    .play-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Persistent Player Bar */
    .player-bar {
      height: 74px;
      background: var(--player-bg);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 20px;
      shrink: 0;
      z-index: 50;
    }
    .player-track-info {
      display: flex; align-items: center; gap: 12px; width: 250px;
    }
    .player-art {
      width: 44px; height: 44px; border-radius: 6px; background: #1e2436;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .player-controls {
      display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; max-width: 500px;
    }
    .player-btns { display: flex; align-items: center; gap: 14px; }
    .player-btn-main {
      width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
      border: none; color: #fff; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px;
    }
    .progress-wrap {
      width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted);
      font-family: ui-monospace, monospace;
    }
    .progress-bar {
      flex: 1; height: 4px; background: var(--line); border-radius: 2px; cursor: pointer; position: relative;
    }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: 420px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; color: var(--text); font-size: 13px; outline: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">🎵</div>
      <span>Nexus Music</span>
      <span class="badge"><span class="badge-dot"></span> Lossless Streaming</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary btn-sm" onclick="openAddTrackModal()">+ Add Track</button>
      <a href="https://app.tnhc.dev/" class="btn btn-sm">Platform Dashboard ↗</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Library</div>
      <div class="nav-item active" onclick="setPlaylist('')">💿 All Tracks</div>
      <div class="nav-item" onclick="filterGenre('ambient')">🌌 Ambient / Synth</div>
      <div class="nav-item" onclick="filterGenre('electronic')">⚡ Electronic</div>
      <div class="nav-item" onclick="filterGenre('acoustic')">🎸 Acoustic</div>

      <div class="sidebar-title" style="margin-top: 14px;">
        <span>Playlists</span>
        <button class="btn btn-sm" onclick="promptNewPlaylist()">+</button>
      </div>
      <div id="playlistList" style="display: flex; flex-direction: column; gap: 4px;"></div>
    </aside>

    <main class="main">
      <table class="tracks-table">
        <thead>
          <tr>
            <th style="width: 40px;"></th>
            <th>Title</th>
            <th>Artist</th>
            <th>Album</th>
            <th>Genre</th>
            <th style="text-align: right;">Duration</th>
          </tr>
        </thead>
        <tbody id="tracksBody">
          <tr><td colspan="6" style="text-align: center; color: var(--muted); padding: 40px;">Loading tracks…</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <!-- Bottom Audio Player -->
  <div class="player-bar">
    <div class="player-track-info">
      <div class="player-art" id="playerArt">🎵</div>
      <div style="overflow: hidden;">
        <div style="font-size: 13px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;" id="playerTitle">No Track Playing</div>
        <div style="font-size: 11px; color: var(--muted); white-space: nowrap; text-overflow: ellipsis; overflow: hidden;" id="playerArtist">—</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="player-btns">
        <button class="btn btn-sm" style="border: none; background: transparent;" onclick="prevTrack()">⏮</button>
        <button class="player-btn-main" onclick="togglePlayPause()" id="playPauseBtn">▶</button>
        <button class="btn btn-sm" style="border: none; background: transparent;" onclick="nextTrack()">⏭</button>
      </div>
      <div class="progress-wrap">
        <span id="currentTime">0:00</span>
        <div class="progress-bar" onclick="seek(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="totalDuration">0:00</span>
      </div>
    </div>

    <div style="width: 250px; display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
      <span style="font-size: 12px; color: var(--muted);">🔊</span>
      <input type="range" min="0" max="1" step="0.05" value="0.8" style="width: 80px;" onchange="setVolume(event)"/>
    </div>
  </div>

  <audio id="audioElement"></audio>

  <!-- Add Track Modal -->
  <div class="modal" id="addTrackModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px;">Add Audio Track</h3>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="trackTitle" placeholder="e.g. Solar Wind Symphony" />
      </div>
      <div class="form-group">
        <label>Artist</label>
        <input type="text" id="trackArtist" placeholder="e.g. Nexus Resonance" />
      </div>
      <div class="form-group">
        <label>Album</label>
        <input type="text" id="trackAlbum" placeholder="e.g. Sovereign Orbit" />
      </div>
      <div class="form-group">
        <label>Genre</label>
        <input type="text" id="trackGenre" placeholder="e.g. ambient" />
      </div>
      <div class="form-group">
        <label>Stream / Audio URL</label>
        <input type="text" id="trackUrl" placeholder="e.g. https://... or /api/v1/music/tracks/sample/stream" />
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeAddTrackModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitTrack()">Add Track</button>
      </div>
    </div>
  </div>

  <script>
    let tracks = [];
    let playlists = [];
    let currentTrackIndex = -1;
    const audio = document.getElementById('audioElement');

    async function init() {
      await fetchTracks();
      await fetchPlaylists();
      setupAudioEvents();
    }

    async function fetchTracks(genre) {
      try {
        let url = '/api/v1/music/tracks';
        if (genre) url += `?genre=${encodeURIComponent(genre)}`;
        const res = await fetch(url);
        if (res.ok) {
          tracks = await res.json();
          renderTracks();
        }
      } catch (_) {}
    }

    async function fetchPlaylists() {
      try {
        const res = await fetch('/api/v1/music/playlists');
        if (res.ok) {
          playlists = await res.json();
          renderPlaylists();
        }
      } catch (_) {}
    }

    function formatTime(secs) {
      if (!secs || isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderTracks() {
      const tbody = document.getElementById('tracksBody');
      if (tracks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--muted); padding: 40px;">No tracks in library. Click "+ Add Track" to populate.</td></tr>`;
        return;
      }
      tbody.innerHTML = tracks.map((t, idx) => `
        <tr>
          <td>
            <button class="play-btn" onclick="playTrack(${idx})">${currentTrackIndex === idx && !audio.paused ? '⏸' : '▶'}</button>
          </td>
          <td style="font-weight: 500;">${t.title}</td>
          <td>${t.artist}</td>
          <td style="color: var(--muted);">${t.album || '—'}</td>
          <td><span class="badge" style="font-size: 10px;">${t.genre || 'general'}</span></td>
          <td style="text-align: right; font-family: monospace; color: var(--muted);">${formatTime(t.duration || 180)}</td>
        </tr>
      `).join('');
    }

    function renderPlaylists() {
      const container = document.getElementById('playlistList');
      container.innerHTML = playlists.map(p => `
        <div class="nav-item" onclick="loadPlaylist('${p.id}')">
          <span>📁 ${p.name}</span>
          <span style="font-size: 11px; opacity: 0.6;">${p.trackCount || 0}</span>
        </div>
      `).join('');
    }

    function playTrack(idx) {
      if (currentTrackIndex === idx) {
        togglePlayPause();
        return;
      }
      currentTrackIndex = idx;
      const track = tracks[idx];
      document.getElementById('playerTitle').textContent = track.title;
      document.getElementById('playerArtist').textContent = track.artist;
      document.getElementById('totalDuration').textContent = formatTime(track.duration || 180);

      const src = track.url || `/api/v1/music/tracks/${track.id}/stream`;
      audio.src = src;
      audio.play().catch(() => {});
      document.getElementById('playPauseBtn').textContent = '⏸';
      renderTracks();
    }

    function togglePlayPause() {
      if (currentTrackIndex < 0 && tracks.length > 0) {
        playTrack(0);
        return;
      }
      if (audio.paused) {
        audio.play().catch(() => {});
        document.getElementById('playPauseBtn').textContent = '⏸';
      } else {
        audio.pause();
        document.getElementById('playPauseBtn').textContent = '▶';
      }
      renderTracks();
    }

    function prevTrack() {
      if (tracks.length === 0) return;
      const prev = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      playTrack(prev);
    }

    function nextTrack() {
      if (tracks.length === 0) return;
      const next = (currentTrackIndex + 1) % tracks.length;
      playTrack(next);
    }

    function setupAudioEvents() {
      audio.ontimeupdate = () => {
        if (!audio.duration) return;
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressFill').style.width = `${pct}%`;
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
      };
      audio.onended = () => nextTrack();
    }

    function seek(e) {
      const bar = e.currentTarget;
      const rect = bar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      if (audio.duration) audio.currentTime = pct * audio.duration;
    }

    function setVolume(e) {
      audio.volume = parseFloat(e.target.value);
    }

    function filterGenre(g) { fetchTracks(g); }
    function setPlaylist(_) { fetchTracks(); }

    function openAddTrackModal() { document.getElementById('addTrackModal').classList.add('show'); }
    function closeAddTrackModal() { document.getElementById('addTrackModal').classList.remove('show'); }

    async function submitTrack() {
      const title = document.getElementById('trackTitle').value.trim();
      const artist = document.getElementById('trackArtist').value.trim();
      const album = document.getElementById('trackAlbum').value.trim();
      const genre = document.getElementById('trackGenre').value.trim();
      const url = document.getElementById('trackUrl').value.trim();

      if (!title || !artist) return alert("Title and Artist are required");

      try {
        const res = await fetch('/api/v1/music/tracks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, artist, album, genre, url, duration: 210 })
        });
        if (!res.ok) throw new Error(await res.text());
        closeAddTrackModal();
        await fetchTracks();
      } catch (err) {
        alert("Failed to add track: " + err.message);
      }
    }

    async function promptNewPlaylist() {
      const name = prompt("Enter playlist name:");
      if (!name) return;
      await fetch('/api/v1/music/playlists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      await fetchPlaylists();
    }

    init();
  </script>
</body>
</html>
