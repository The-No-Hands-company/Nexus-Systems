[package]
name = "nexus-mailfed"
description = "Federation for Nexus Email: node keys, signed handoffs between nodes, and relay rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ed25519-dalek = "3.0"
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
nexus-mailstore = { path = "../nexus-mailstore" }
nexus-maildelivery = { path = "../nexus-maildelivery" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
nexus-mailmsg = { path = "../nexus-mailmsg" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true }
uuid = { workspace = true }
