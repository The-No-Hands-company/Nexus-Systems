# Required for getrandom 0.3 on wasm32-unknown-unknown: the backend is selected
# by cfg, not by feature alone. Kept here rather than in an env var so the build
# works the same for anyone who runs `wasm-pack build`, including CI.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
