name: Nexus Systems CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript / Bun apps ────────────────────────────────────────
  bun-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Nexus-Design
          - Nexus-Draw
          - Nexus-Graphic
          - Nexus-Photos
          - Nexus-Video
          - Nexus-Notes
          - Nexus-Tasks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps (npm, more reliable in CI)
        run: cd apps/${{ matrix.app }} && npm install --prefer-offline 2>/dev/null || npm install
      - name: Typecheck
        run: cd apps/${{ matrix.app }} && npx tsc --noEmit
      - name: Test
        run: cd apps/${{ matrix.app }} && bun test
        env:
          NEXUS_CLOUD_ENABLE_CLOUD_INTEGRATION: "false"

  # ── Rust engines ─────────────────────────────────────────────────
  rust-engines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Nexus-Design
          - Nexus-Draw
          - Nexus-Graphic
          - Nexus-Photos
          - Nexus-Video
          - Nexus-GPU-Test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build + Test
        run: cd apps/${{ matrix.app }}/engine && cargo test

  # ── React frontends ──────────────────────────────────────────────
  frontends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Nexus-Design
          - Nexus-Draw
          - Nexus-Graphic
          - Nexus-Photos
          - Nexus-Video
          - Nexus-GPU-Test
          - Nexus-Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Nexus-Dashboard/frontend/src/index.css imports
      # packages/nexus-design/dist/nexus-tokens.css, and dist/ is gitignored
      # (generated, not committed — three of the four themes never render on a
      # real screen in this repo, so committing stale output would be worse
      # than regenerating it). Its own package.json "build"/"check" scripts
      # already cd into packages/nexus-design and run `bun run build` first;
      # that prebuild step needs bun on PATH, which no other app in this
      # matrix does.
      - uses: oven-sh/setup-bun@v2
        if: matrix.app == 'Nexus-Dashboard'
        with:
          bun-version: latest
      - name: Install + Check + Build
        run: |
          cd apps/${{ matrix.app }}/frontend
          npm install
          if [ "${{ matrix.app }}" = "Nexus-Dashboard" ]; then
            npm run check
            npm run test
            npm run build
          else
            npx tsc --noEmit
            npx vite build
          fi

  # ── Design tokens (packages/nexus-design) ─────────────────────────
  #
  # Previously not covered by any job — "Nexus-Design" above is
  # apps/Nexus-Design, an unrelated app. Nothing enforced the contrast gate
  # on push, so a theme value that failed AA could merge unnoticed. `bun run
  # build` is what actually runs the gate (see src/generate.ts): it fails
  # the whole step if any pair drops below its required ratio.
  nexus-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # tests/vendor.test.ts is excluded, not run and ignored: it checks that
      # apps/Nexus and apps/Nexus-Cloud carry byte-identical vendored copies
      # of the generated CSS, and both are git submodules actions/checkout
      # does not fetch by default (same fact the contracts/smoke jobs below
      # work around for Nexus-Cloud alone). Running it here without fetching
      # both submodules would fail this job on every push for a reason
      # unrelated to what it exists to catch, defeating the point of finally
      # having it run at all.
      - name: Test (excludes tests/vendor.test.ts — see comment above)
        run: |
          cd packages/nexus-design
          bun test tests/contrast.test.ts tests/components.test.ts tests/flatten.test.ts tests/generate.test.ts tests/themes.test.ts
      - name: Build (runs the contrast gate, regenerates dist/)
        run: cd packages/nexus-design && bun run build

  # ── API Contract Validation ──────────────────────────────────────
  contracts:
    runs-on: ubuntu-latest
    needs: [bun-apps]
    steps:
      - uses: actions/checkout@v4
      # apps/Nexus-Cloud is a submodule and actions/checkout does not fetch
      # submodules by default, so the directory arrives empty and every step
      # below that reaches into it fails. Fetched on its own rather than with
      # `submodules: true`, which would also clone dhts/GameDevelopmentToolset —
      # a 408 MB repo this job has no use for.
      - name: Check out Nexus-Cloud (submodule, not fetched by default)
        uses: actions/checkout@v4
        with:
          repository: The-No-Hands-company/Nexus-Cloud
          path: apps/Nexus-Cloud
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Cloud deps
        run: cd apps/Nexus-Cloud && npm install --prefer-offline 2>/dev/null || npm install
      # if/then rather than `[ test ] && cmd`: steps run under `bash -e`, and a
      # `&&` chain whose guard is false on the final iteration makes the loop —
      # and so the whole step — exit non-zero even though nothing went wrong.
      - name: Symlink node_modules for apps
        run: |
          for app in $(ls apps/ | grep -E '^Nexus-[A-Z]'); do
            if [ -f "apps/$app/package.json" ] && [ ! -e "apps/$app/node_modules" ]; then
              ln -sfn "$PWD/apps/Nexus-Cloud/node_modules" "apps/$app/node_modules"
            fi
          done
      - name: Fix data directories
        run: |
          for app in apps/*/; do
            if [ ! -e "$app/data" ]; then
              ln -sfn ../../data "${app%/}/data"
            fi
          done
      - name: Run contract validation
        run: chmod +x scripts/test/contract-test.sh && ./scripts/test/contract-test.sh

  # ── Integration Smoke Test ───────────────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    needs: [bun-apps]
    steps:
      - uses: actions/checkout@v4
      # Same reason as the contracts job above: submodules are not fetched by
      # default, and this job runs Nexus-Cloud.
      - name: Check out Nexus-Cloud (submodule, not fetched by default)
        uses: actions/checkout@v4
        with:
          repository: The-No-Hands-company/Nexus-Cloud
          path: apps/Nexus-Cloud
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Cloud deps
        run: cd apps/Nexus-Cloud && npm install --prefer-offline 2>/dev/null || npm install
      # See the contracts job: `[ test ] && cmd` in a loop makes the step exit
      # non-zero whenever the guard is false on the final iteration.
      - name: Symlink node_modules + fix data
        run: |
          for app in $(ls apps/ | grep -E '^Nexus-[A-Z]'); do
            if [ -f "apps/$app/package.json" ] && [ ! -e "apps/$app/node_modules" ]; then
              ln -sfn "$PWD/apps/Nexus-Cloud/node_modules" "apps/$app/node_modules"
            fi
            if [ ! -e "apps/$app/data" ]; then
              ln -sfn ../../data "apps/$app/data"
            fi
          done
      - name: Run smoke test
        run: chmod +x scripts/test/smoke-test.sh && ./scripts/test/smoke-test.sh
