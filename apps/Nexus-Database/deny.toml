# cargo-deny 0.20 configuration
# Run: cargo deny check
# CI: see .github/workflows/ci.yml

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# ── Documented exemptions ────────────────────────────────────────────────────
ignore = [
    # ── rsa — Marvin Attack ──────────────────────────────────────────────────
    # No production code path decrypts with rsa; no fix available upstream.
    { id = "RUSTSEC-2023-0071", reason = "rsa only used in test/internal key generation; no decrypt() in production; no fix available" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "rust-crypto" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
