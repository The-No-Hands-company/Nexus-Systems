<!--
  Front-door buttons for the tnhc.dev marketing site.

  ALREADY APPLIED, in React, in the site's own Header component
  (github.com/The-No-Hands-company/tnhc.dev, commit dccb28c). This plain-HTML
  version is kept as the reference for anywhere else the same two entry points
  are needed — a docs page, an error page, a second site.

  Paste into the site's header or hero. Plain anchors and inline styles on
  purpose: the marketing site is a separate project with its own build and its
  own CSS, so this has to work without importing anything or matching a class
  naming scheme it might change tomorrow.

  The links are absolute. Relative ones would depend on the _redirects file
  being deployed correctly, and these should still work if it is not.
-->

<!-- Request access: the way in for someone who has no account yet. -->
<a
  href="https://app.tnhc.dev/request"
  style="
    display: inline-block;
    padding: 0.6rem 1.15rem;
    border-radius: 0.4rem;
    background: #2563eb;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    line-height: 1.2;
  "
  >Request access</a
>

<!--
  Sign in. redirect_uri sends people to their app grid afterwards rather than
  back to the marketing page they just left. It is URL-encoded because it is a
  query parameter, and the gate validates it against the domain before honouring
  it, so an off-domain value here would simply be ignored.
-->
<a
  href="https://auth.tnhc.dev/login?redirect_uri=https%3A%2F%2Fapp.tnhc.dev"
  style="
    display: inline-block;
    padding: 0.6rem 1.15rem;
    border-radius: 0.4rem;
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: inherit;
    font-weight: 600;
    text-decoration: none;
    line-height: 1.2;
    margin-left: 0.5rem;
  "
  >Sign in</a
>

<!--
  Optional, but it saves you support questions: access is invite-only and there
  is no confirmation email, which surprises people who expect one.
-->
<p style="margin-top: 0.75rem; font-size: 0.875rem; opacity: 0.7">
  Access is invite-only. Request an account and you will be given a claim code to
  save — there is no confirmation email.
</p>
