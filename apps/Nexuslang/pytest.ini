[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
timeout = 60
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    unit: marks tests as unit tests
    slow: marks tests as slow-running
    requires_llvm: marks tests requiring llvmlite
    performance: wall-clock timing budgets; excluded from the correctness suite
        because shared CI runners cannot honour an absolute millisecond figure.
        Owned by the perf-smoke job instead (deselect with '-m "not performance"')
