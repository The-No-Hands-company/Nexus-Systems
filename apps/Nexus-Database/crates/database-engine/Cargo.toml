[package]
name = "database-engine"
version = "0.1.0"
edition = "2021"
description = "Nexus Database Engine — pluggable storage engine with B-Tree + LSM-Tree"

[dependencies]
# RUSTSEC-2025-0141 is an "unmaintained" notice, not a vulnerability: the
# authors ceased development and consider 1.3.3 the complete version. Pinned
# there deliberately. The advisory applies to every 1.x release, so it will keep
# matching until this migrates off bincode.
bincode = "1.3.3"
thiserror = "2"
parking_lot = "0.12"
log = "0.4"
# >= 1.44.2 clears RUSTSEC-2025-0023 and the GHSA set (see Nexus-Security).
tokio = { version = "1.44.2", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

[dev-dependencies]
tempfile = "3"
