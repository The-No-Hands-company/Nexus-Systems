[package]
name = "nexus-mailsmtp"
description = "SMTP for Nexus Email: the session state machine and the listener"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nexus-mailstore = { path = "../nexus-mailstore" }
nexus-mailmsg = { path = "../nexus-mailmsg" }
nexus-maildelivery = { path = "../nexus-maildelivery" }
nexus-mailauth = { path = "../nexus-mailauth" }
nexus-mailimap = { path = "../nexus-mailimap" }
nexus-mailfed = { path = "../nexus-mailfed" }
nexus-mailout = { path = "../nexus-mailout" }
axum = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
subtle = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true }

[[bin]]
name = "nexus-mailsmtpd"
path = "src/main.rs"
