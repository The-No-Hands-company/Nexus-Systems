services:
  forge:
    build: .
    ports:
      - "127.0.0.1:8094:8094"
    volumes:
      - forge-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8094/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  forge-data:
    driver: local
